# filepath: .github/workflows/build.yml
name: Build and Test Bun App

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Bun
      uses: oven-sh/setup-bun@0d9b296af33f2b851fcbf4df3e9ec89751734ba4 # v1.3.14
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run tests
      run: bun test

    - name: Check server starts
      run: |
        timeout 10s bun run src/index.js &
        sleep 3
        kill $! || true
      shell: bash