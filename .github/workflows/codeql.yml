name: "CodeQL Vulnerability Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]
  schedule:
    # Run security scans on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  analyze:
    name: Analyze TypeScript Code
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows - upload analysis results
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # required for checkout
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
        # CodeQL supports: 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild for TypeScript
      uses: github/codeql-action/autobuild@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
      with:
        category: "/language:${{ matrix.language }}"
        # SARIF is generated automatically and uploaded to GitHub Security tab
        upload: true

    - name: Copy SARIF into workspace
      if: always()
      run: |
        mkdir -p results
        mv "${{ github.workspace }}/../results"/*.sarif results/ || echo "no sarif files"

    - name: Upload CodeQL SARIF Results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codeql-sarif-${{ matrix.language }}-${{ github.run_id }}
        path: results/**/*.sarif
        retention-days: 30
        if-no-files-found: warn
        compression-level: 9
