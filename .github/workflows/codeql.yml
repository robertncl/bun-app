name: "CodeQL Vulnerability Scan"

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]
  schedule:
    # Run security scans on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  analyze:
    name: Analyze TypeScript Code
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows - upload analysis results
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # required for checkout
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'actions' ]
        # CodeQL supports: 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild for TypeScript
      uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        category: "/language:${{ matrix.language }}"
        # SARIF is generated automatically and uploaded to GitHub Security tab
        upload: true

    - name: Copy SARIF into workspace
      if: always()
      run: |
        mkdir -p results
        mv "${{ github.workspace }}/../results"/*.sarif results/ || echo "no sarif files"

    - name: Upload CodeQL SARIF Results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: codeql-sarif-${{ matrix.language }}-${{ github.run_id }}
        path: results/**/*.sarif
        retention-days: 30
        if-no-files-found: warn
        compression-level: 9
