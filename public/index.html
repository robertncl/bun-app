<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Weather Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🌤</span>
        <span class="logo-text">WeatherMap Live</span>
      </div>
      <div class="header-status">
        <div class="pulse-dot" id="pulse-dot"></div>
        <span id="last-updated">Connecting...</span>
      </div>
    </header>

    <div class="layout">
      <div id="map" class="map"></div>

      <aside class="sidebar">
        <div id="detail-panel" class="detail-panel hidden"></div>
        <div id="cities-panel" class="cities-panel">
          <h3 class="panel-title">All Stations</h3>
          <div id="cities-list" class="cities-list"></div>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
