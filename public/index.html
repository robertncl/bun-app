<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BunTrade — Paper Trading Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="acme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="acme-wordmark"><span class="acme-wordmark__mark">B</span>BunTrade</span>
        <span class="acme-badge acme-badge--warning">Paper</span>
      </div>
      <div class="live-status">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span id="market-clock">—</span>
      </div>
    </header>

    <div class="account-strip" id="header-portfolio"></div>

    <main class="layout">
      <section class="market">
        <div class="market-header">
          <h3 class="section-title">Markets</h3>
          <input id="search" class="acme-input search" type="text" placeholder="Search symbol or name…" autocomplete="off" />
        </div>
        <div class="asset-tabs-wrap"><div class="acme-tabs asset-tabs" id="asset-tabs" role="tablist"></div></div>
        <div id="market-list" class="market-list"></div>
      </section>

      <aside class="panel-col">
        <section id="trade-panel" class="acme-card panel-card trade-card"></section>

        <section class="acme-card panel-card">
          <div class="card-head">
            <h3 class="section-title">Portfolio</h3>
            <span id="pf-equity" class="card-head-value"></span>
          </div>
          <div id="portfolio-body" class="portfolio-body"></div>
        </section>

        <section class="acme-card panel-card">
          <div class="card-head"><h3 class="section-title">Order history</h3></div>
          <div id="orders-body" class="orders-body"></div>
        </section>
      </aside>
    </main>

    <div id="toast" class="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
