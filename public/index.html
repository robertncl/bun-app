<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BunTrade — Paper Trading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="acme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="acme-topbar bt-topbar">
    <a class="acme-wordmark bt-wordmark" href="#trade"><span class="acme-wordmark__mark">B</span>BunTrade</a>
    <nav class="acme-topbar__nav bt-nav" aria-label="Main" data-i18n-aria-label="nav.label">
      <a class="acme-topbar__link" href="#trade" aria-current="page" data-i18n="nav.trade">Trade</a>
      <a class="acme-topbar__link" href="#portfolio" data-i18n="nav.portfolio">Portfolio</a>
      <a class="acme-topbar__link" href="#orders" data-i18n="nav.orders">Orders</a>
    </nav>
    <div class="bt-meta">
      <span class="acme-badge acme-badge--info">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span data-i18n="header.paper">Paper account</span>
      </span>
      <span class="bt-updated" id="updated-label" data-i18n="header.connecting">Connecting…</span>
      <div class="bt-prefs">
        <label class="sr-only" for="lang-select" data-i18n="prefs.language">Language</label>
        <select id="lang-select" class="acme-input bt-select" data-i18n-aria-label="prefs.language" aria-label="Language"></select>
        <label class="sr-only" for="currency-select" data-i18n="prefs.currency">Display currency</label>
        <select id="currency-select" class="acme-input bt-select" data-i18n-aria-label="prefs.currency" aria-label="Display currency"></select>
      </div>
    </div>
  </header>

  <main class="bt-main">
    <section id="trade" class="bt-summary" aria-label="Account summary" data-i18n-aria-label="summary.label"></section>

    <div class="bt-trade-row">
      <section class="acme-card bt-card bt-markets" aria-labelledby="markets-h">
        <div class="bt-markets__head">
          <div class="bt-card-head">
            <h2 id="markets-h" class="bt-card-title" data-i18n="markets.title">Markets</h2>
            <span class="bt-card-meta" id="market-count"></span>
          </div>
          <div class="acme-field">
            <label class="acme-label sr-only" for="search" data-i18n="markets.search">Search markets</label>
            <input id="search" class="acme-input" type="search" placeholder="Search symbol or name" data-i18n-placeholder="markets.searchPlaceholder" autocomplete="off" />
          </div>
          <div class="acme-tabs bt-asset-tabs" id="asset-tabs" role="tablist" aria-label="Asset class" data-i18n-aria-label="markets.assetClass"></div>
        </div>
        <div class="bt-market-scroll">
          <table class="acme-table bt-market-table">
            <thead>
              <tr>
                <th scope="col" data-i18n="markets.colSymbol">Symbol</th>
                <th scope="col" class="bt-col-spark"><span class="sr-only" data-i18n="markets.colTrend">Trend</span></th>
                <th scope="col" class="acme-table__num bt-col-price" id="col-price">Price</th>
              </tr>
            </thead>
            <tbody id="market-list"></tbody>
          </table>
        </div>
      </section>

      <section class="acme-card bt-card bt-chart" id="chart-card" aria-live="off" aria-labelledby="chart-h"></section>

      <section class="acme-card bt-card bt-ticket" id="trade-card" aria-labelledby="ticket-h"></section>
    </div>

    <section id="portfolio" class="acme-card bt-card bt-table-card" aria-labelledby="pos-h">
      <div class="bt-card-head bt-table-card__head">
        <h2 id="pos-h" class="bt-card-title" data-i18n="positions.title">Open positions</h2>
        <span class="bt-card-meta" id="pf-meta"></span>
      </div>
      <div id="portfolio-body"></div>
    </section>

    <section id="orders" class="acme-card bt-card bt-table-card" aria-labelledby="ord-h">
      <div class="bt-card-head bt-table-card__head">
        <h2 id="ord-h" class="bt-card-title" data-i18n="orders.title">Order history</h2>
        <span class="bt-card-meta" id="orders-meta"></span>
      </div>
      <div id="orders-body"></div>
    </section>

    <footer class="bt-footer">
      <span data-i18n="footer.sim">BunTrade is a simulation. Prices are randomly generated and reset when the server restarts.</span>
      <span id="footer-start">Started with $100,000 in paper cash</span>
      <span id="footer-fx" hidden></span>
    </footer>
  </main>

  <div id="toast" class="bt-toast" role="status" aria-live="polite"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
